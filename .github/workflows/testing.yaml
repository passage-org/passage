name: Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: x64
          cache: maven

      - name: Build modules
        run: mvn --batch-mode --update-snapshots package -DskipTests -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Run tests of modules
        run: mvn --batch-mode --update-snapshots -Dmaven.test.failure.ignore=true test -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      # v2 is refused outright by GitHub, which fails the job before it runs a
      # single test: "automatically failed because it uses a deprecated version
      # of actions/upload-artifact: v2".
      - uses: actions/upload-artifact@v7  # upload test results
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results
          path: ./*/target/surefire-reports/*.xml # prefixed with * since they are in submodules
          # Say so here rather than in the report workflow, which otherwise
          # fails much later with "No test report files were found".
          if-no-files-found: error
      
